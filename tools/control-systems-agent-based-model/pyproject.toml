[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control-systems-agent-based-model"
version = "0.1.0"
description = "Control Systems Agent-Based Model — minimal reproduction package for Jones & Voicu (2026) 'Control Physiology: An Agent-Based Model of FAIR-CAM Dynamics'"
requires-python = ">=3.10"
authors = [
    {name = "Jack Jones"},
    {name = "Laura Voicu", email = "laura.voicu@me.com"},
]
license = {text = "CC-BY-NC-SA-4.0"}
readme = "README.md"

dependencies = [
    "mesa>=2.1,<3.1",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "transitions>=0.9",
    "scipy>=1.10",
    "ruamel.yaml>=0.18",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
